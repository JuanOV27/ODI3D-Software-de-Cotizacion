<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="img/logo-odi3d.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ODI3D — Acceso al sistema</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --negro:       #000000;
            --blanco:      #FFFFFF;
            --amarillo:    #F5C518;
            --gris-oscuro: #111111;
            --gris-medio:  #1A1A1A;
            --gris-borde:  #2A2A2A;
            --error:       #FF4444;
        }

        body {
            background: var(--negro);
            color: var(--blanco);
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* Fondo con rejilla sutil */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(var(--gris-borde) 1px, transparent 1px),
                linear-gradient(90deg, var(--gris-borde) 1px, transparent 1px);
            background-size: 40px 40px;
            opacity: 0.35;
            pointer-events: none;
        }

        .login-wrapper {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 420px;
            padding: 1.5rem;
        }

        /* Marca */
        .login-marca {
            text-align: center;
            margin-bottom: 2.5rem;
        }
        .login-marca .logo-texto {
            font-size: 2.4rem;
            font-weight: 900;
            letter-spacing: -0.04em;
            color: var(--blanco);
        }
        .login-marca .logo-texto span {
            color: var(--amarillo);
        }
        .login-marca .logo-sub {
            font-size: 0.78rem;
            color: #666;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            margin-top: 0.3rem;
        }

        /* Card */
        .login-card {
            background: var(--gris-medio);
            border: 1px solid var(--gris-borde);
            border-radius: 12px;
            padding: 2.5rem 2rem;
        }

        .login-card h2 {
            font-size: 1.05rem;
            font-weight: 600;
            color: #aaa;
            margin-bottom: 1.8rem;
            text-align: center;
            letter-spacing: 0.02em;
        }

        /* Campos */
        .campo {
            margin-bottom: 1.2rem;
        }
        .campo label {
            display: block;
            font-size: 0.78rem;
            color: #888;
            margin-bottom: 0.4rem;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }
        .campo input {
            width: 100%;
            background: var(--negro);
            border: 1px solid var(--gris-borde);
            border-radius: 7px;
            color: var(--blanco);
            font-size: 0.95rem;
            padding: 0.7rem 0.9rem;
            outline: none;
            transition: border-color 0.2s ease-out;
        }
        .campo input:focus {
            border-color: var(--amarillo);
        }
        .campo input::placeholder { color: #444; }

        /* Mensaje de error */
        .error-msg {
            display: none;
            background: rgba(255,68,68,0.12);
            border: 1px solid rgba(255,68,68,0.35);
            border-radius: 7px;
            color: var(--error);
            font-size: 0.85rem;
            padding: 0.65rem 0.9rem;
            margin-bottom: 1.2rem;
            text-align: center;
        }
        .error-msg.visible { display: block; }

        /* Botón */
        .btn-login {
            width: 100%;
            background: var(--amarillo);
            color: var(--negro);
            border: none;
            border-radius: 7px;
            font-size: 0.95rem;
            font-weight: 700;
            padding: 0.75rem;
            cursor: pointer;
            letter-spacing: 0.04em;
            transition: opacity 0.2s ease-out, transform 0.15s ease-out;
            margin-top: 0.5rem;
        }
        .btn-login:hover { opacity: 0.88; }
        .btn-login:active { transform: scale(0.98); }
        .btn-login:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Spinner dentro del botón */
        .btn-login .spinner {
            display: inline-block;
            width: 14px; height: 14px;
            border: 2px solid rgba(0,0,0,0.3);
            border-top-color: var(--negro);
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            vertical-align: middle;
            margin-right: 6px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Pie de la card */
        .login-footer {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.75rem;
            color: #444;
        }

        /* Banner de redirección al sistema correcto */
        .redirect-banner {
            display: none;
            background: rgba(245,197,24,0.12);
            border: 1px solid rgba(245,197,24,0.4);
            border-radius: 7px;
            padding: 0.85rem 1rem;
            margin-bottom: 1.2rem;
            text-align: center;
        }
        .redirect-banner.visible { display: block; }
        .redirect-banner .rb-titulo {
            font-size: 0.92rem;
            font-weight: 700;
            color: var(--amarillo);
            margin-bottom: 0.25rem;
        }
        .redirect-banner .rb-desc {
            font-size: 0.8rem;
            color: #aaa;
        }
        .redirect-banner .rb-spinner {
            display: inline-block;
            width: 12px; height: 12px;
            border: 2px solid rgba(245,197,24,0.3);
            border-top-color: var(--amarillo);
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            vertical-align: middle;
            margin-right: 5px;
        }
    </style>
</head>
<body>

<div class="login-wrapper">
    <div class="login-marca">
        <div class="logo-texto">ODI<span>3D</span></div>
        <div class="logo-sub">Sistema de gestión interno</div>
    </div>

    <div class="login-card">
        <h2>Iniciar sesión</h2>

        <div class="redirect-banner" id="redirectBanner">
            <div class="rb-titulo" id="redirectTitulo"></div>
            <div class="rb-desc"><span class="rb-spinner"></span> <span id="redirectDesc"></span></div>
        </div>

        <div class="error-msg" id="errorMsg"></div>

        <form id="loginForm" novalidate>
            <input type="hidden" id="csrfToken" name="csrf_token" value="" />

            <div class="campo">
                <label for="email">Correo electrónico</label>
                <input type="email" id="email" name="email"
                       placeholder="admin@odi3d.com" autocomplete="username" required />
            </div>

            <div class="campo">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password"
                       placeholder="••••••••" autocomplete="current-password" required />
            </div>

            <button type="submit" class="btn-login" id="btnLogin">
                Ingresar
            </button>
        </form>

        <div class="login-footer">
            ODI3D &mdash; Ortiz Diseño e Impresión 3D
        </div>
    </div>
</div>

<script>
(function () {
    'use strict';

    // Detectar base URL del sistema (funciona aunque esté en una subcarpeta, ej: /ODI3D/gestion3d/)
    const BASE = (() => {
        const m = location.pathname.match(/(.*\/gestion3d)\//);
        return m ? m[1] : '/gestion3d';
    })();

    // URL del backend y frontend de la tienda (ajustar en producción)
    const TIENDA_API_URL      = '/ODI3D/tienda3d/public/api';
    const TIENDA_FRONTEND_URL = 'http://localhost:5173';

    const form         = document.getElementById('loginForm');
    const btnLogin     = document.getElementById('btnLogin');
    const errorMsg     = document.getElementById('errorMsg');
    const csrfInput    = document.getElementById('csrfToken');
    const redirectBanner = document.getElementById('redirectBanner');

    // Obtener token CSRF del servidor al cargar
    async function cargarCSRF() {
        try {
            const resp = await fetch(`${BASE}/api/api_auth.php?action=check_session`);
            const json = await resp.json();
            // El token lo devuelve check_session o puede solicitarse
            // Usamos el que genera la sesión en el servidor vía cookie
        } catch (_) {}
        // Generar token del lado cliente para el envío (el servidor lo valida contra $_SESSION)
        // La primera petición de login inicia la sesión y genera el token
    }

    // Solicitar token CSRF al servidor (lo genera al iniciar sesión)
    async function obtenerCSRF() {
        try {
            const resp = await fetch(`${BASE}/api/api_auth.php?action=get_csrf`);
            if (resp.ok) {
                const json = await resp.json();
                if (json.success && json.data?.csrf_token) {
                    csrfInput.value = json.data.csrf_token;
                }
            }
        } catch (_) {}
    }

    function mostrarError(msg) {
        errorMsg.textContent = msg;
        errorMsg.classList.add('visible');
    }

    function ocultarError() {
        errorMsg.classList.remove('visible');
    }

    function mostrarRedirect(titulo, desc) {
        document.getElementById('redirectTitulo').textContent = titulo;
        document.getElementById('redirectDesc').textContent   = desc;
        redirectBanner.classList.add('visible');
        errorMsg.classList.remove('visible');
    }

    // Verificar si las credenciales pertenecen a un cliente de tienda3d.
    // Si sí, lo autentica allá y lo redirige con auto-login via URL params.
    async function verificarEnTienda(email, password) {
        try {
            const resp = await fetch(`${TIENDA_API_URL}/auth/login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            });
            if (!resp.ok) return false;
            const json = await resp.json();
            if (!json.success || !json.token) return false;

            // Es un cliente de la tienda — redirigir con auto-login
            const cliente  = json.cliente || {};
            const nombre   = cliente.nombre || email;
            const params   = new URLSearchParams({
                __odi_token:   json.token,
                __odi_cliente: JSON.stringify(cliente)
            });
            mostrarRedirect(
                `👋 ¡Hola, ${nombre}!`,
                'Tus credenciales son de la tienda ODI3D. Redirigiendo al portal de clientes...'
            );
            setBloqueado(true);
            setTimeout(() => {
                window.location.href = `${TIENDA_FRONTEND_URL}/?${params.toString()}`;
            }, 2200);
            return true;
        } catch (e) {
            return false;
        }
    }

    function setBloqueado(bloqueado) {
        btnLogin.disabled = bloqueado;
        if (bloqueado) {
            btnLogin.innerHTML = '<span class="spinner"></span> Procesando...';
        } else {
            btnLogin.textContent = 'Ingresar';
        }
    }

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        ocultarError();

        const email    = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;

        if (!email || !password) {
            mostrarError('Completa todos los campos.');
            return;
        }

        setBloqueado(true);

        try {
            const resp = await fetch(`${BASE}/api/api_auth.php?action=login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    email,
                    password,
                    csrf_token: csrfInput.value
                })
            });

            const json = await resp.json();

            if (json.success) {
                const rol = json.data?.rol;
                window.location.href = `${BASE}/${rol === 'empleado' ? 'panel-empleado.html' : 'index.html'}`;
            } else {
                // Login en gestion3d falló — verificar si son credenciales de tienda3d
                const esCliente = await verificarEnTienda(email, password);
                if (!esCliente) {
                    mostrarError(json.message || json.error || 'Credenciales incorrectas');
                    setBloqueado(false);
                }
                // Si esCliente=true, la redirección ya fue iniciada por verificarEnTienda()
            }
        } catch (err) {
            mostrarError('Error de conexión. Verifica que el servidor esté activo.');
            setBloqueado(false);
        }
    });

    // Redirigir si ya hay sesión activa
    fetch(`${BASE}/api/api_auth.php?action=check_session`)
        .then(r => r.json())
        .then(json => {
            if (json.success && json.data?.autenticado) {
                const rol = json.data?.rol;
                window.location.href = `${BASE}/${rol === 'empleado' ? 'panel-empleado.html' : 'index.html'}`;
            }
        })
        .catch(() => {});

    // Obtener token CSRF para el formulario
    obtenerCSRF();

    // Pre-llenar email si viene como parámetro en la URL (?email=...) —
    // usado cuando gestion3d redirige aquí a un empleado que intentó entrar por tienda3d
    const urlEmail = new URLSearchParams(location.search).get('email');
    if (urlEmail) {
        const emailInput = document.getElementById('email');
        emailInput.value = decodeURIComponent(urlEmail);
        // Mover foco a la contraseña para agilizar el login
        document.getElementById('password').focus();
    }
})();
</script>
</body>
</html>
